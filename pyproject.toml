[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgtotext"
version = "0.1.1"
description = "Aplicacion de escritorio para describir imagenes con Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "google-genai>=1.0",
  "Pillow>=11,<13",
  "keyring>=25,<26",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
imgtotext = "imgtotext.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
